[project]
name = "quotes-tracker"
version = "0.1.0"
description = "Ежедневный сбор цитат с quotes.toscrape.com/js/ с публикацией на GitHub Pages"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
